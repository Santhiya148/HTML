<!DOCTYPE html>
<html>
<head>
    <title>Task Deletion Confirmation & Feedback</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f5f5f5;
        }

        h2{
            color:#333;
        }

        button{
            background:red;
            color:white;
            border:none;
            padding:12px 25px;
            font-size:16px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:darkred;
        }

        #result{
            margin-top:20px;
            font-size:18px;
            color:blue;
        }
    </style>

    <script>

    function deleteTask(){

        alert("You are about to delete a task.");

        var confirmDelete = confirm("Are you sure you want to delete this task?");

        if(confirmDelete){

            var reason = prompt("Please enter the reason for deleting the task:");

            if(reason=="" || reason==null){

                document.getElementById("result").innerHTML =
                "Task deleted without giving a reason.";

            }

            else{

                document.getElementById("result").innerHTML =
                "Task deleted successfully.<br><br>Reason : " + reason;

            }

        }

        else{

            document.getElementById("result").innerHTML =
            "Task deletion cancelled.";

        }

    }

    </script>

</head>

<body>

<h2>Task Deletion Confirmation & Feedback</h2>

<button onclick="deleteTask()">Delete Task</button>

<p id="result"></p>

</body>
</html>
