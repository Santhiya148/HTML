<!DOCTYPE html>
<html>
<head>
<title>Time Table</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}
table{
    width:80%;
    margin:40px auto;
    border-collapse:collapse;
}
th,td{
    border:1px solid #000;
    text-align:center;
    padding:10px;
}
th{
    background:#d9d9d9;
}
.se{background:#c6efce;}
.cg{background:#ddebf7;}
.vc{background:#fff2cc;}
.wdd{background:#ead1dc;}
.lab{background:#f4b183;}
.cyb{background:#ffe699;}
</style>
</head>
<body>

<h2 align="center">III CS B - Timetable</h2>

<table>
<tr>
    <th>Day</th>
    <th>1</th>
    <th>2</th>
    <th>3</th>
    <th>4</th>
    <th>5</th>
</tr>

<tr>
<td><b>Monday</b></td>
<td class="se">SE</td>
<td class="cg">CG</td>
<td class="vc">VC/BD</td>
<td class="wdd">WDD</td>
<td class="wdd">WDD</td>
</tr>

<tr>
<td><b>Tuesday</b></td>
<td class="se">SE</td>
<td class="cg">CG</td>
<td class="wdd">WDD</td>
<td class="cg">CG</td>
<td class="se">SE</td>
</tr>

<tr>
<td><b>Wednesday</b></td>
<td class="lab" colspan="2">WDD Lab</td>
<td class="cg">CG</td>
<td class="vc">VC/BD</td>
<td class="lab">SBS Theory</td>
</tr>

<tr>
<td><b>Thursday</b></td>
<td class="wdd">WDD</td>
<td class="se">SE</td>
<td class="vc">VC/BD</td>
<td class="cyb">Cyber Security</td>
<td></td>
</tr>

<tr>
<td><b>Friday</b></td>
<td class="lab" colspan="2">WDD Lab</td>
<td class="cg">CG</td>
<td class="vc">VC/BD</td>
<td></td>
</tr>

<tr>
<td><b>Saturday</b></td>
<td class="vc">VC/BD</td>
<td class="wdd">WDD</td>
<td class="se">SE</td>
<td class="lab" colspan="2">SBS Lab</td>
</tr>

</table>

</body>
</html>
