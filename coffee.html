<!DOCTYPE html>
<html>
<head>
    <title>Coffee Shop Advertisement</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5e6d3;
        }

        .container{
            width:80%;
            margin:30px auto;
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px gray;
        }

        .header{
            background:#6F4E37;
            color:white;
            text-align:center;
            padding:15px;
            border-radius:10px;
        }

        .offer{
            background:#FFD700;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            padding:10px;
            margin:20px 0;
            color:#8B0000;
        }

        .content{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .menu{
            width:60%;
        }

        .menu h2{
            color:#6F4E37;
        }

        .menu ul{
            line-height:35px;
        }

        .image{
            width:35%;
            text-align:center;
        }

        .image img{
            width:200px;
            border-radius:10px;
        }

        .footer{
            background:#6F4E37;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="container">

<div class="header">
<h1>☕ Brew Bliss Coffee Shop ☕</h1>
<h3>Fresh Coffee • Fresh Mood</h3>
</div>

<div class="offer">
🎉 Buy 1 Coffee, Get 1 Free Every Friday! 🎉
</div>

<div class="content">

<div class="menu">
<h2>Our Special Menu</h2>

<ul>
<li>Espresso</li>
<li>Cappuccino</li>
<li>Latte</li>
<li>Cold Coffee</li>
<li>Mocha</li>
<li>Hot Chocolate</li>
<li>Sandwiches</li>
<li>Chocolate Brownie</li>
</ul>

</div>

<div class="image">
<img src="https://images.unsplash.com/photo-1495474472287
